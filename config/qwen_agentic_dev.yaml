# Development config for genome_skeptic_agentic only.
# Does not replace config/qwen_external_v5.yaml.
# Does not change V5 scientific thresholds, families, validators, or freeze files.
# Thresholds are omitted so pydantic defaults remain identical to the frozen V5 campaign yaml.

project:
  organism_mode: bacterial_isolate
  threads: 4

llm:
  enabled: true
  provider: openai_compatible
  model: qwen3:4b
  base_url: http://localhost:11434/v1
  api_key: ollama
  temperature: 0.0
  timeout_seconds: 600
  thinking: false
  keep_alive: 30m
  max_output_tokens: 256
  planner:
    provider: openai_compatible
    model: qwen3:4b
    base_url: http://localhost:11434/v1
    api_key: ollama
    temperature: 0.0
    timeout_seconds: 600
    thinking: false
    keep_alive: 30m
    max_output_tokens: 320
  critic:
    provider: openai_compatible
    model: qwen3:4b
    base_url: http://localhost:11434/v1
    api_key: ollama
    temperature: 0.0
    timeout_seconds: 600
    thinking: false
    keep_alive: 30m
    max_output_tokens: 320

execution:
  enable_critic: true
  allow_model_to_choose_actions: true
  stop_on_hard_gate: true
  enable_falsification: true
