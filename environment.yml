# Streamlit Cloud / research-demo environment only (branch demo/streamlit-showcase).
# Do not restore the full production bioinformatics stack here — Cloud will try to
# install SPAdes/QUAST/etc. and then fail to install Streamlit.
# BLAST+ and HMMER for optional Live Analysis come from packages.txt (apt).
name: genome-skeptic-demo
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - streamlit>=1.50,<2
      - pandas>=2.2
      - altair>=5
      - pydantic>=2.8
      - typer>=0.12
      - PyYAML>=6
      - requests>=2.32
