# POST-HOC MODEL ABLATION. Not the manuscript primary system.
# Identifier: GS_AGENTIC_V4_1_SOL56_HIGH_POSTHOC
# POST_HOC_MODEL_ABLATION = TRUE
# MANUSCRIPT_PRIMARY_SYSTEM = FALSE
#
# Replaces only the LLM backend for GS_AGENTIC_V4_1 Planner/Critic.
# Thresholds are omitted so pydantic defaults remain identical to the frozen campaign.

project:
  organism_mode: bacterial_isolate
  threads: 4

llm:
  enabled: true
  provider: openai_api
  model: gpt-5.6-sol
  temperature: 0.0
  timeout_seconds: 1800
  thinking: false
  max_output_tokens: 16000
  planner:
    provider: openai_api
    model: gpt-5.6-sol
    temperature: 0.0
    timeout_seconds: 1800
    thinking: false
    max_output_tokens: 16000
  critic:
    provider: openai_api
    model: gpt-5.6-sol
    temperature: 0.0
    timeout_seconds: 1800
    thinking: false
    max_output_tokens: 16000

execution:
  enable_critic: true
  allow_model_to_choose_actions: true
  stop_on_hard_gate: true
  enable_falsification: true
