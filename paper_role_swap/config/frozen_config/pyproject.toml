[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genome-skeptic"
version = "0.1.0"
description = "Agentic bacterial genome assembly and annotation with adversarial scientific validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "typer>=0.12",
  "PyYAML>=6.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
genome-skeptic = "genome_skeptic.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/genome_skeptic"]

[tool.pytest.ini_options]
pythonpath = ["src"]
