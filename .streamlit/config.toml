[theme]
base = "light"
primaryColor = "#1f5f7a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f6f8"
textColor = "#1d2a33"

[server]
maxUploadSize = 15
headless = true
enableXsrfProtection = true

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
